<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亞洲大學 校園 10 景導覽</title>
<style>
  body{font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;margin:0;padding:0;background:#f5f7fa;color:#1f2937}
  header{background:linear-gradient(135deg,#0f6cbf,#0a4da3);color:#fff;padding:48px 24px;text-align:center}
  header h1{margin:0 0 8px;font-size:1.9rem}
  header p{margin:0;opacity:.9}
  main{max-width:1080px;margin:0 auto;padding:28px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .15s ease, box-shadow .15s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
  .card img{width:100%;height:220px;object-fit:cover;display:block;background:#eef1f4}
  .card figcaption{padding:12px 16px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>亞洲大學 Campus Quest</h1>
  <p>新生校園探索 ｜ 10 大景點地標</p>
</header>
<main>
  <div class="grid">
    <figure class="card"><img src="./01-taichi-lake.jpg" alt="太極湖"><figcaption>太極湖</figcaption></figure>
    <figure class="card"><img src="./02-tadao-ando-museum.jpg" alt="安藤忠雄現代美術館"><figcaption>安藤忠雄現代美術館</figcaption></figure>
    <figure class="card"><img src="./03-administration-library.jpg" alt="行政大樓(圖書館)"><figcaption>行政大樓（圖書館）</figcaption></figure>
    <figure class="card"><img src="./04-asia-hospital.jpg" alt="亞大醫院"><figcaption>亞大醫院</figcaption></figure>
    <figure class="card"><img src="./05-xifu-dorm.jpg" alt="惜福學苑"><figcaption>惜福學苑</figcaption></figure>
    <figure class="card"><img src="./06-it-engineering.jpg" alt="資訊電機學院"><figcaption>資訊電機學院</figcaption></figure>
    <figure class="card"><img src="./07-management-social-science.png" alt="管理暨社會科學學院"><figcaption>管理暨社會科學學院</figcaption></figure>
    <figure class="card"><img src="./08-zhumeng-college.png" alt="築夢學院"><figcaption>築夢學院</figcaption></figure>
    <figure class="card"><img src="./09-roman-colosseum-gym.png" alt="羅馬競技場(體育館)"><figcaption>羅馬競技場（體育館）</figcaption></figure>
    <figure class="card"><img src="./10-nursing-college.jpg" alt="護理學院"><figcaption>護理學院</figcaption></figure>
  </div>
</main>
</body>
</html>
